[package]
name = "math-draw"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "Standalone single-binary deterministic math/graph engine and recursive agent engineering CLI built on Burn 0.22.1 (burn-flex)"

[[bin]]
name = "math-draw"
path = "src/main.rs"

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "flex", "simd", "rayon", "autodiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
